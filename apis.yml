aid: rebel-foods
name: Rebel Foods
description: 'Rebel Foods is an Indian cloud-kitchen operator, headquartered in Mumbai, that describes
  itself as the world''s largest chain of internet restaurants. It runs a portfolio of delivery-first
  food brands — Faasos, Behrouz Biryani, Oven Story, Firangi Bake, The Good Bowl, Sweet Truth, Mandarin
  Oak, The Biryani Life and Lunch Box — out of a shared network of cloud kitchens, and consolidates them
  for consumers in the EatSure ordering app. Its internal technology platform, the Rebel Operating System,
  handles kitchen workflow, inventory, demand forecasting, order routing and logistics, and is offered
  to third-party restaurant chains through the Rebel Launcher partner programme. That platform is a commercial
  partnership, not a self-serve developer product: as of this profile Rebel Foods publishes no developer
  portal, no public API documentation, and no machine-readable API contract.'
